[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vjepa2-physics-scorer"
version = "0.2.0"
description = "Evaluation benchmark adapter for Video World Models (V-JEPA 2) on Physical Violation-of-Expectation (VoE)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "rivas-vega" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
cloud = [
    "modal>=0.63.0",
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
    "aiofiles>=23.0.0",
]
dev = [
    "pytest>=7.0.0",
    "scipy>=1.10.0",
]
